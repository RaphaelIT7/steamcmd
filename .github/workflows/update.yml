name: Build, and Push

on:
  workflow_dispatch:
  schedule:
    - cron: '18 4 */5 * *'

jobs:
  build:
    runs-on: ubuntu-24.04 # RaphaelIT7: Same issue with steamcmd being 32x and failing (See https://github.com/CFC-Servers/GLuaTest/pull/116)

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get Latest Tag
        id: latest_tag
        run: |
          echo "Latest tag: test"
          echo "tag_name=test" >> $GITHUB_OUTPUT

      - name: Push new build
        uses: ./.github/actions/build_and_push
        with:
          tag_name: ${{ steps.latest_tag.outputs.tag_name }}
          release: true
          github_token: ${{ secrets.GITHUB_TOKEN }}
